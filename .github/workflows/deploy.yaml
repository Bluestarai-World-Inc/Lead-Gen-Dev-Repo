name: Deploy to S3

on:
  push:
    branches:
      - main  # Or 'master', whichever is your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Install Node and Build
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # Use the version matching your local environment
        
    - name: Install Dependencies
      run: npm ci

    - name: Build Project
      run: npm run build

    # 3. Deploy to S3
    - name: Sync to S3
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read --delete
      env:
        AWS_S3_BUCKET: 'leadgen-dev-test' # Put your EXACT bucket name here
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-east-2' # Change to your bucket's region
        SOURCE_DIR: 'build' # Ensure this matches your build folder name (sometimes it is 'dist')